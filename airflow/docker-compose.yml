# Local Airflow 3.x (LocalExecutor) on Docker, running dbt against Databricks.
# Airflow 3 differences vs 2.x: webserver -> api-server, a separate dag-processor,
# and the FAB auth manager for classic admin/admin login.
#   cp .env.example .env   # fill in your Databricks creds
#   docker compose build && docker compose up -d   # UI: http://localhost:8080 (admin/admin)
x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ''
    # Airflow 3 signs inter-component (execution API) calls with this JWT secret:
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # CRITICAL in multi-container Airflow 3: tasks reach the Execution API by the api-server's
    # SERVICE NAME, not localhost. Without this, tasks die → "state mismatch ... failed".
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://apiserver:8080/execution/'
    # dbt's profiles.yml (mounted below) reads these via env_var():
    DATABRICKS_HOST: ${DATABRICKS_HOST}
    DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
    DATABRICKS_CATALOG: ${DATABRICKS_CATALOG:-zomato}
    DATABRICKS_SCHEMA: ${DATABRICKS_SCHEMA:-landing}
    # exposed to DAGs as the Airflow Variable `s3_bucket` (used by the landing COPY INTO sql):
    AIRFLOW_VAR_S3_BUCKET: ${S3_BUCKET}
    DBT_PROFILES_DIR: /opt/airflow/dbt_profiles
    DBT_PROJECT_DIR: /opt/airflow/dbt/zomato
    # lets DatabricksSqlOperator / DatabricksSubmitRunOperator etc. work out of the box:
    AIRFLOW_CONN_DATABRICKS_DEFAULT: '{"conn_type":"databricks","host":"${DATABRICKS_HOST}","password":"${DATABRICKS_TOKEN}","extra":{"http_path":"${DATABRICKS_HTTP_PATH}"}}'
    # ai/connections.py + ai/enrich_reviews.py need these:
    GROQ_API_KEY: ${GROQ_API_KEY}
    GROQ_MODEL_NAME: ${GROQ_MODEL_NAME}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./dbt_profiles:/opt/airflow/dbt_profiles     # profiles.yml (templated, no secrets committed)
    - ../zomato:/opt/airflow/dbt/zomato             # your dbt project
    - ./include:/opt/airflow/include                # landing COPY INTO sql
    - ../ai:/opt/airflow/ai                         # enrich_reviews.py + shared ai/ package
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com
    depends_on:
      postgres:
        condition: service_healthy

  apiserver:
    <<: *airflow-common
    command: api-server          # Airflow 3: replaces `webserver`
    ports: ["8080:8080"]
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow-common
    command: dag-processor       # Airflow 3: DAG parsing is its own component
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
