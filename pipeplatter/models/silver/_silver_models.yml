version: 2
models:
  - name: sl_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: restaurant_id
        tests: [not_null]
  - name: sl_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
  - name: sl_restaurants
    columns:
      - name: restaurant_id
        tests: [unique, not_null]
  - name: sl_users
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: sl_reviews
    columns:
      - name: review_id
        tests: [unique, not_null]